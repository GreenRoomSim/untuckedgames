<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Untucked Games ballots</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
<link rel="stylesheet" href="style.css">
</head><body><main class="wide">
<div class="top"><span class="brand">Untucked <i>Games</i> &middot; Ballots</span>
  <span><a class="btn small" href="admin.html" style="text-decoration:none">Admin</a> <button class="btn small" id="out" hidden>Sign out</button></span></div>
<section id="login" hidden>
  <h1>Admin sign in</h1>
  <label for="e">Email</label><input id="e" type="email" autocomplete="username">
  <label for="p">Password</label><input id="p" type="password" autocomplete="current-password">
  <p id="lerr" class="err" role="alert"></p><button class="btn primary block" id="go">Sign in</button>
</section>
<div id="app" hidden>
  <p id="msg" class="sub"></p>
  <div id="polls"></div>
</div>
</main>
<script type="module">
import {firebaseConfig} from "./firebase-config.js";
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,onSnapshot,collection,writeBatch,setDoc,deleteDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const auth=getAuth(initializeApp(firebaseConfig)),db=getFirestore(),$=id=>document.getElementById(id);
const MODE={placements:"Placements",lipsync:"Lip sync",winner:"Winner vote",groups:"Group vote",rank:"Rate a queen",wildcard:"Wildcard",gohome:"Who should go home",assassin:"Lip sync assassin"};
let B=[],V={},C={},S=null,RV={},RS=[],subs=[];
const openPolls=new Set(),openBallots=new Set();
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const nm=id=>(C[id]||{}).name||"?";

$("go").onclick=async()=>{$("lerr").textContent="";
  try{await signInWithEmailAndPassword(auth,$("e").value,$("p").value)}catch{$("lerr").textContent="Sign in failed."}};
$("p").onkeydown=e=>{if(e.key==="Enter")$("go").click()};
$("out").onclick=()=>signOut(auth);

onAuthStateChanged(auth,user=>{
  subs.forEach(u=>u());subs=[];
  $("login").hidden=!!user;$("app").hidden=!user;$("out").hidden=!user;
  if(!user)return;
  const bad=()=>{$("msg").textContent="This account isn\u2019t the admin, or the rules aren\u2019t published yet."};
  subs.push(onSnapshot(collection(db,"ballots"),s=>{$("msg").textContent="";B=s.docs.map(d=>({...d.data(),_ref:d.ref,_id:d.id}));render()},bad));
  subs.push(onSnapshot(collection(db,"voters"),s=>{V={};s.docs.forEach(d=>V[d.id]=d.data().name);render()},()=>{}));
  subs.push(onSnapshot(collection(db,"contestants"),s=>{C={};s.docs.forEach(d=>C[d.id]=d.data());render()},()=>{}));
  subs.push(onSnapshot(collection(db,"reviews"),s=>{RV={};s.docs.forEach(d=>RV[d.id]=d.data());render()},()=>{}));
  subs.push(onSnapshot(collection(db,"restrictions"),s=>{RS=s.docs.map(d=>({...d.data(),_id:d.id}));render()},()=>{}));
  subs.push(onSnapshot(doc(db,"state","current"),s=>{S=s.exists()?s.data():null;render()},()=>{}));
});

function av(id){const c=C[id]||{};if(c.photo){const i=el("img","av sm");i.src=c.photo;i.alt="";return i}return el("span","av sm",(c.name||"?")[0])}
function chips(label,ids,cls){
  const g=el("div","grp"),h=el("div","row");h.append(el("strong","",label));
  const w=el("div","chips");
  if(!ids.length)w.append(el("span","hint","Nobody"));
  ids.forEach(id=>w.append(el("span","pick sm "+cls,nm(id))));
  g.append(h,w);return g;
}
function detail(b){
  const d=el("div");d.style.padding="4px 0 8px";
  if(b.mode==="placements"){
    d.append(chips(b.win&&b.win.length>1?"Win (double)":"Win",b.win||[],b.win&&b.win.length>1?"dwin":"win"),chips("High",b.high||[],"high"),chips("Low",b.low||[],"low"),chips("Bottom",b.bottom||[],"bottom"));
    d.append(el("p","hint","Everyone else on the poll was Safe."));
  }else if(b.mode==="groups"){
    d.append(chips("Best group",[],"safe"));
    d.lastChild.querySelector(".chips").innerHTML="";d.lastChild.querySelector(".chips").append(el("span","pick sm safe",b.group==="a"?"Group 1":"Group 2"));
    d.append(chips("Winners",b.win||[],"win"),chips("Bottoms",b.bottom||[],"bottom"));
  }else if(b.mode==="wildcard"){
    d.append(chips("Bracket 1 pick",b.a?[b.a]:[],"win"),chips("Bracket 2 pick",b.b?[b.b]:[],"win"));
  }else if(b.mode==="lipsync"){
    const ids=b.choices||(b.choice?[b.choice]:[]);d.append(chips(ids.length>1?"Winners":"Winner",ids,"win"));
  }else if(b.mode==="winner"||b.mode==="gohome"){
    d.append(chips(b.mode==="gohome"?"Should go home":"Picked",b.choice?[b.choice]:[],b.mode==="gohome"?"bottom":"win"));
  }else if(b.mode==="assassin"){
    d.append(chips("Should go home",b.home?[b.home]:[],"bottom"));
    const g=el("div","grp"),h=el("div","row"),w=el("div","chips");h.append(el("strong","","Lip sync winner"));
    w.append(el("span","pick sm win",b.winner==="tas"?"Top All Star":"Lip Sync Assassin"));g.append(h,w);d.append(g);
  }else if(b.mode==="rank"){
    const ol=el("ol");ol.style.cssText="margin:0;padding:0;list-style:none";
    (b.ranking||[]).forEach((id,i)=>{const li=el("li","crow");li.append(el("span","rank",String(i+1)),av(id),el("span","",nm(id)));li.firstChild.style.cssText="width:1.6em;font-weight:900;color:var(--muted)";ol.append(li)});
    d.append(el("div","end","Best"),ol,el("div","end","Worst"));
  }else d.append(el("p","hint","Unknown ballot format."));
  return d;
}

async function removePoll(key,list){
  if(!confirm("Delete all "+list.length+" ballot"+(list.length===1?"":"s")+" in this poll? This removes them from the database and can\u2019t be undone."))return;
  try{for(let i=0;i<list.length;i+=400){const wb=writeBatch(db);list.slice(i,i+400).forEach(b=>wb.delete(b._ref));await wb.commit()}}
  catch{$("msg").textContent="Couldn\u2019t delete. Make sure the updated rules are published."}
}

const TIER={win:5,high:4,low:2,bottom:1},TL={5:"Win",4:"High",3:"Safe",2:"Low",1:"Bottom"};
const FL={a:"bracket 1",b:"bracket 2",group:"best group",win:"winner",bottom:"bottom",home:"go home",winner:"lip sync winner",choices:"lip sync winner"};
const MIN=5;
function flags(list){
  const out=new Map(),tmp=new Map(),n=list.length;
  list.forEach(b=>{out.set(b._id,[]);tmp.set(b._id,[])});
  if(n<MIN)return out;
  const add=(b,d,t)=>tmp.get(b._id).push({d,t});
  const mode=list[0].mode;
  const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
  if(mode==="rank"){
    const ids=[...new Set(list.flatMap(b=>b.ranking||[]))],N=ids.length;
    ids.forEach(id=>{
      const ps=list.map(b=>(b.ranking||[]).indexOf(id)+1);
      list.forEach((b,k)=>{const p=ps[k];if(!p)return;const o=ps.filter((x,j)=>j!==k&&x>0);if(o.length<3)return;
        const avg=mean(o),d=Math.abs(p-avg);
        if(d>=Math.max(3,.4*N))add(b,d,"Ranked "+nm(id)+" #"+p+"; others averaged #"+avg.toFixed(1));});
    });
  }else if(mode==="placements"){
    const ids=[...new Set(list.flatMap(b=>["win","high","low","bottom"].flatMap(k=>b[k]||[])))];
    const score=(b,id)=>{for(const k of ["win","high","low","bottom"])if((b[k]||[]).includes(id))return TIER[k];return 3};
    ids.forEach(id=>{
      const ss=list.map(b=>score(b,id));
      list.forEach((b,k)=>{const s=ss[k];if(s===3)return;const avg=mean(ss.filter((x,j)=>j!==k)),d=Math.abs(s-avg);
        if(d>=2.5)add(b,d,"Placed "+nm(id)+" "+TL[s]+"; others averaged "+avg.toFixed(1)+" out of 5");});
    });
  }else{
    const picks=b=>{const m=b.mode,r=[];
      if(m==="winner"||m==="gohome")r.push(["choice",b.choice]);
      else if(m==="lipsync")(b.choices||[b.choice]).forEach(x=>r.push(["choices",x]));
      else if(m==="wildcard"){r.push(["a",b.a]);r.push(["b",b.b])}
      else if(m==="groups"){r.push(["group",b.group]);(b.win||[]).forEach(x=>r.push(["win",x]));(b.bottom||[]).forEach(x=>r.push(["bottom",x]))}
      else if(m==="assassin"){r.push(["home",b.home]);r.push(["winner",b.winner])}
      return r.filter(x=>x[1])};
    const lab=(f,v)=>f==="group"?(v==="a"?"Group 1":"Group 2"):f==="winner"?(v==="tas"?"the Top All Star":"the Assassin"):nm(v);
    const cnt={},top={};
    list.forEach(b=>picks(b).forEach(([f,v])=>{const k=f+"|"+v;cnt[k]=(cnt[k]||0)+1;if(!top[f]||cnt[k]>top[f].c)top[f]={v,c:cnt[k]}}));
    list.forEach(b=>picks(b).forEach(([f,v])=>{
      if(cnt[f+"|"+v]===1&&top[f]&&top[f].c>=Math.ceil(n/2))
        add(b,1,"Only voter to pick "+lab(f,v)+(FL[f]?" for "+FL[f]:"")+"; "+top[f].c+" of "+n+" picked "+lab(f,top[f].v));
    }));
  }
  tmp.forEach((arr,id)=>out.set(id,arr.sort((x,y)=>y.d-x.d).slice(0,4).map(x=>x.t)));
  return out;
}

const ms=b=>b.at&&b.at.toMillis?b.at.toMillis():0;
const review=b=>{const r=RV[b._id];return r&&r.at===ms(b)?r:null};
async function setReview(b,patch){
  const cur=review(b)||{};
  try{await setDoc(doc(db,"reviews",b._id),{mark:cur.mark||null,ignored:!!cur.ignored,...patch,at:ms(b)})}
  catch{$("msg").textContent="Couldn\u2019t save. Make sure the updated rules are published."}
}
async function discard(b){
  const who=V[b.uid]||"this voter",rd=b.round!==undefined;
  if(!confirm("Discard "+who+"\u2019s ballot"+(rd?" and stop them voting in poll "+b.round:"")+"? The ballot is deleted from the database and can\u2019t be recovered."))return;
  try{
    const wb=writeBatch(db);wb.delete(b._ref);wb.delete(doc(db,"reviews",b._id));
    if(rd)wb.set(doc(db,"restrictions","r"+b.round+"_"+b.uid),{round:b.round,uid:b.uid,at:serverTimestamp()});
    await wb.commit();
  }catch{$("msg").textContent="Couldn\u2019t discard. Make sure the updated rules are published."}
}
async function lift(r){
  if(!confirm("Let "+(V[r.uid]||"this voter")+" vote in poll "+r.round+" again?"))return;
  try{await deleteDoc(doc(db,"restrictions",r._id))}catch{$("msg").textContent="Couldn\u2019t lift the restriction."}
}
function btn(label,fn,danger){const x=el("button","btn small",label);x.type="button";x.onclick=fn;if(danger){x.style.color="var(--c-bottom)";x.style.borderColor="var(--c-bottom)"}return x}

function render(){
  const P=$("polls");P.innerHTML="";
  const groups={};
  B.forEach(b=>{const k=b.round!==undefined?String(b.round):"old";(groups[k]=groups[k]||[]).push(b)});
  RS.forEach(r=>{const k=String(r.round);groups[k]=groups[k]||[]});
  const keys=Object.keys(groups).sort((a,b)=>a==="old"?1:b==="old"?-1:Number(b)-Number(a));
  if(!keys.length){P.append(el("p","sub","No ballots yet."));return}
  keys.forEach(k=>{
    const list=groups[k].slice().sort((a,b)=>(V[a.uid]||"").localeCompare(V[b.uid]||""));
    const fl=k==="old"?new Map():flags(list),cur=S&&String(S.round)===k,info=new Map();
    list.forEach(b=>{
      const rv=review(b),auto=fl.get(b._id)||[];
      const manual=!!(rv&&rv.mark==="flagged"),cleared=!!(rv&&rv.mark==="cleared");
      info.set(b._id,{manual,cleared,auto,ign:!!(rv&&rv.ignored),stale:!!RV[b._id]&&!rv,
        isFlag:manual||(auto.length>0&&!cleared),why:(manual?["Flagged by you"]:[]).concat(auto.length&&!cleared?auto:[])});
    });
    const nflag=list.filter(b=>info.get(b._id).isFlag).length,nign=list.filter(b=>info.get(b._id).ign).length;
    list.sort((a,b)=>info.get(b._id).isFlag-info.get(a._id).isFlag);
    const rs=RS.filter(r=>String(r.round)===k),first=list[0];
    const ep=first?first.ep:(cur?S.ep:"?"),md=first?first.mode:(cur?S.mode:"");
    const det=el("details","poll");det.open=openPolls.has(k);
    det.addEventListener("toggle",()=>{det.open?openPolls.add(k):openPolls.delete(k)});
    const sm=el("summary","psum"),left=el("div");
    left.append(el("strong","",k==="old"?"Earlier ballots":"Poll "+k+" \u00b7 Episode "+ep+(md?" \u00b7 "+(MODE[md]||md):"")));
    left.append(el("div","hint",list.length+" ballot"+(list.length===1?"":"s")+(cur?(S.open?" \u00b7 open now":" \u00b7 locked"):"")+(nflag?" \u00b7 "+nflag+" flagged":"")+(nign?" \u00b7 "+nign+" ignored":"")+(rs.length?" \u00b7 "+rs.length+" restricted":"")));
    sm.append(left);det.append(sm);
    const body=el("div");body.style.padding="0 16px 14px";
    if(cur&&S.title)body.append(el("p","chal",S.title));
    if(!list.length)body.append(el("p","hint","No ballots in this poll."));
    else if(k!=="old"&&list.length<MIN)body.append(el("p","hint","Ballots are only checked for unusual votes once a poll has "+MIN+" or more."));
    list.forEach(b=>{
      const x=info.get(b._id),d=el("details","entry"),key=k+"/"+b._id;d.open=openBallots.has(key);
      d.addEventListener("toggle",()=>{d.open?openBallots.add(key):openBallots.delete(key)});
      const s=el("summary","esum"),nw=el("span");
      nw.append(el("strong","",V[b.uid]||"Unknown voter"));
      if(x.isFlag){const f=el("span","flag","Flagged");f.style.marginLeft="10px";nw.append(f)}
      if(x.ign){const f=el("span","flag dim","Ignored");f.style.marginLeft="8px";nw.append(f)}
      s.append(nw,el("span","hint",b.at&&b.at.toDate?b.at.toDate().toLocaleString([],{dateStyle:"medium",timeStyle:"short"}):""));
      const dd=detail(b);
      if(x.why.length){const w=el("div","why");w.append(el("strong","","Why it was flagged"));const ul=el("ul");ul.style.cssText="margin:6px 0 0;padding-left:18px";x.why.forEach(t=>ul.append(el("li","",t)));w.append(ul);dd.prepend(w)}
      if(x.cleared&&x.auto.length)dd.prepend(el("p","hint","You cleared the automatic flag on this ballot."));
      if(x.stale)dd.prepend(el("p","hint","This ballot was changed after you last reviewed it, so earlier flags and ignores no longer apply."));
      const act=el("div","row");act.style.cssText="justify-content:flex-start;gap:8px;margin-top:10px;flex-wrap:wrap";
      act.append(
        x.isFlag?btn("Clear flag",()=>setReview(b,{mark:"cleared"})):btn("Flag",()=>setReview(b,{mark:"flagged"})),
        x.ign?btn("Count again",()=>setReview(b,{ignored:false})):btn("Ignore in results",()=>setReview(b,{ignored:true})),
        btn(b.round!==undefined?"Discard + Restrict":"Discard",()=>discard(b),true));
      dd.append(act);
      d.append(s,dd);body.append(d);
    });
    if(rs.length){
      const g=el("div","grp");g.style.marginTop="14px";g.append(el("strong","","Restricted from this poll"));
      rs.forEach(r=>{const row=el("div","row");row.style.marginTop="6px";row.append(el("span","",V[r.uid]||"Unknown voter"),btn("Lift restriction",()=>lift(r)));g.append(row)});
      body.append(g);
    }
    if(list.length){const del=el("button","btn small","Delete this poll\u2019s ballots");del.type="button";del.style.marginTop="12px";del.onclick=()=>removePoll(k,list);body.append(del)}
    det.append(body);P.append(det);
  });
}
</script></body></html>
