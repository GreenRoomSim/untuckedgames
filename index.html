<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Untucked Games</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
<link rel="stylesheet" href="style.css">
</head><body><main>
<div class="top"><span class="brand">Untucked <i>Games</i></span><span><span id="hi" class="hint"></span> <button class="btn small" id="out" hidden>Sign out</button></span></div>

<section id="login" hidden>
  <h1>Sign in</h1><p class="sub">Use the username and code you were sent.</p>
  <label for="u">Username</label><input id="u" autocomplete="username" autocapitalize="none">
  <label for="c">Code</label><input id="c" type="password" inputmode="numeric" autocomplete="current-password">
  <p id="lerr" class="err" role="alert"></p>
  <button class="btn primary block" id="go">Sign in</button>
</section>

<div id="app" hidden>
  <p id="msg" class="sub"></p>
  <section id="poll" hidden></section>
</div>
</main>
<script type="module">
import {firebaseConfig,emailFor,passFor} from "./firebase-config.js";
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,onSnapshot,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const auth=getAuth(initializeApp(firebaseConfig)),db=getFirestore(),$=id=>document.getElementById(id);
const MODE={placements:"Placements",lipsync:"Lip sync",winner:"Winner vote"};
const HELP={winner:"Who should win? You can\u2019t vote for yourself."};
const ORDER=["win","high","low","bottom"],LABEL={win:"Win",high:"High",safe:"Safe",low:"Low",bottom:"Bottom"};
const calm=matchMedia("(prefers-reduced-motion: reduce)").matches;
let S=null,me=null,sel={win:[],high:[],low:[],bottom:[]},choice=null,lw=[],lcount=1,step=0,added=null,saved=false,dirty=false,loadedRound=null,unsub=null,vUnsub=null;
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};

$("go").onclick=async()=>{$("lerr").textContent="";
  try{await signInWithEmailAndPassword(auth,emailFor($("u").value),passFor($("c").value))}
  catch{$("lerr").textContent="That username and code don\u2019t match."}};
$("c").onkeydown=e=>{if(e.key==="Enter")$("go").click()};
$("out").onclick=()=>signOut(auth);

onAuthStateChanged(auth,async user=>{
  if(unsub){unsub();unsub=null}if(vUnsub){vUnsub();vUnsub=null}
  $("login").hidden=!!user;$("app").hidden=!user;$("out").hidden=!user;$("hi").textContent="";
  if(!user)return;
  const v=await getDoc(doc(db,"voters",user.uid));
  if(!v.exists()){$("lerr").textContent="This account isn\u2019t set up to vote.";signOut(auth);return}
  me={...v.data(),uid:user.uid};$("hi").textContent=me.name;loadedRound=null;
  vUnsub=onSnapshot(doc(db,"voters",user.uid),s=>{if(s.exists()){me={...s.data(),uid:user.uid};if(S)render()}});
  unsub=onSnapshot(doc(db,"state","current"),async s=>{
    S=s.data();
    if(S&&loadedRound!==S.round){loadedRound=S.round;await loadBallot()}
    render();
  });
});

const opts=()=>S.options.filter(n=>n!==me.name);
const Q=()=>S.quotas||{};
const steps=()=>ORDER.filter(k=>Q()[k]>0);
const placed=()=>ORDER.flatMap(k=>sel[k]);
const pool=()=>opts().filter(n=>!placed().includes(n));
const complete=()=>S.mode==="placements"?steps().every(k=>sel[k].length===Q()[k]):S.mode==="lipsync"?lw.length===lcount:!!choice;

async function loadBallot(){
  sel={win:[],high:[],low:[],bottom:[]};choice=null;lw=[];lcount=1;saved=false;dirty=false;step=0;added=null;
  if(!S.round)return;
  const b=await getDoc(doc(db,"ballots","r"+S.round+"_"+me.uid));
  if(!b.exists())return;
  saved=true;const d=b.data();
  if(S.mode==="placements"){ORDER.forEach(k=>{sel[k]=(d[k]||[]).filter(n=>opts().includes(n))});if(complete())step=steps().length}
  else if(S.mode==='lipsync'){lw=(d.choices||[]).filter(n=>opts().includes(n));lcount=lw.length||1}
  else choice=opts().includes(d.choice)?d.choice:null;
}

function msg(t){$("msg").textContent=t;$("poll").hidden=true}
function render(){
  $("msg").textContent="";
  if(!S||!S.round)return msg("Nothing is open yet. Check back soon.");
  if(me.canVote===false)return msg("You\u2019re not voting this round.");
  if(!S.open)return msg("Voting is closed. Results are posted in the server.");
  if(S.mode==="lipsync"&&S.options.includes(me.name))return msg("You\u2019re in the lip sync, so you sit this vote out.");
  const P=$("poll");P.hidden=false;P.innerHTML="";
  if(S.mode==="placements"&&!steps().length){P.hidden=true;return msg("This poll was opened before the update and has no placement counts. The admin needs to open a new poll.")}
  if(S.mode==="placements")return stepper(P);
  if(S.mode==="lipsync")return lipsync(P);
  P.append(el("p","kicker","Episode "+S.ep+" \u00b7 "+MODE[S.mode]),el("h1","",S.title),el("p","sub",HELP[S.mode]));
  const g=el("div","opts");
  opts().forEach(n=>{
    const b=el("button","opt",n);b.type="button";b.setAttribute("aria-pressed",String(choice===n));
    b.onclick=()=>{choice=n;dirty=true;g.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));$("save").disabled=false;status()};
    g.append(b);
  });
  P.append(g);footer(P);
}

function lipsync(P){
  const O=opts(),can2=O.length>=3;if(!can2)lcount=1;
  P.append(el("p","kicker","Episode "+S.ep+" \u00b7 Lip sync"),el("h1","",S.title),
    el("p","sub",can2?"Pick one winner, or two. You can\u2019t vote for yourself.":"Who wins the lip sync? Pick one."));
  if(can2){
    const seg=el("div","seg");seg.style.marginBottom="16px";
    [1,2].forEach(n=>{const b=el("button","",n===1?"1 winner":"2 winners");b.type="button";b.setAttribute("aria-pressed",String(lcount===n));
      b.onclick=()=>{lcount=n;lw=lw.slice(0,n);dirty=true;render()};seg.append(b)});
    P.append(seg);
  }
  const g=el("div","opts");
  O.forEach(n=>{
    const b=el("button","opt",n);b.type="button";b.setAttribute("aria-pressed",String(lw.includes(n)));
    b.onclick=()=>{lw=lw.includes(n)?lw.filter(x=>x!==n):[...lw.slice(Math.max(0,lw.length-lcount+1)),n];dirty=true;render()};
    g.append(b);
  });
  P.append(g,el("p","hint",lw.length+" of "+lcount+" chosen."));footer(P);
}

function title(k){const q=Q()[k];
  return k==="win"?(q>1?"Select your winners":"Select your winner"):k==="high"?(q>1?"Select your highs":"Select your high"):
    k==="low"?(q>1?"Select your lows":"Select your low"):(q>1?"Select your bottom "+q:"Select your bottom");}

function burst(host,color){
  for(let n=0;n<26;n++){const s=el("span","cf");
    s.style.setProperty("--dx",(Math.random()*260-130)+"px");s.style.setProperty("--dy",(Math.random()*-170-20)+"px");
    s.style.setProperty("--r",(Math.random()*720-360)+"deg");s.style.setProperty("--cc",["#fff","#ffd700",color,"#add8e6"][n%4]);
    host.append(s);setTimeout(()=>s.remove(),1000);}
}

function stepper(P){
  const S_=steps(),total=S_.length;
  if(step>=total)return review(P);
  const k=S_[step],q=Q()[k],cls=k==="win"&&q>1?"dwin":k;
  P.append(el("p","kicker","Episode "+S.ep+" \u00b7 Step "+(step+1)+" of "+total),el("h1","",title(k)));
  if(step===0)P.append(el("p","sub",S.title));
  const stage=el("div","stage");
  sel[k].forEach(n=>{
    const b=el("button","pick "+cls+(n===added?" new":""));b.type="button";
    if(cls==="dwin")b.append(el("small","","Double win"));else if(k==="win")b.append(el("small","","Winner"));
    b.append(document.createTextNode(n));b.setAttribute("aria-label","Remove "+n);
    b.onclick=()=>{sel[k]=sel[k].filter(x=>x!==n);dirty=true;added=null;render()};
    stage.append(b);
    if(n===added&&k==="win"&&!calm)burst(b,cls==="dwin"?"#00008b":"#4169e1");
  });
  for(let n=sel[k].length;n<q;n++)stage.append(el("div","slot","?"));
  P.append(stage);added=null;
  const full=sel[k].length===q,pl=el("div","pool");
  pool().forEach(n=>{
    const b=el("button","cand",n);b.type="button";b.disabled=full;
    b.onclick=()=>{sel[k].push(n);dirty=true;added=n;render()};
    pl.append(b);
  });
  P.append(pl,el("p","hint",sel[k].length+" of "+q+" chosen. Tap a chosen name to take it back."));
  const nav=el("div","nav"),back=el("button","btn","Back"),next=el("button","btn primary",step===total-1?"Review":"Next");
  back.type=next.type="button";back.hidden=step===0;next.disabled=!full;
  back.onclick=()=>{step--;render()};next.onclick=()=>{step++;render()};
  nav.append(back,next);P.append(nav);
}

function review(P){
  P.append(el("p","kicker","Episode "+S.ep+" \u00b7 Your lineup"),el("h1","","Check your ballot"));
  const groups=[...ORDER.slice(0,2),"safe",...ORDER.slice(2)].filter(k=>k==="safe"||Q()[k]>0);
  groups.forEach(k=>{
    const names=k==="safe"?pool():sel[k],g=el("div","grp"),h=el("div","row");
    h.append(el("strong","",LABEL[k]+(k==="win"&&Q().win>1?" (double)":"")));
    if(k!=="safe"){const e=el("button","btn small","Edit");e.type="button";e.onclick=()=>{step=steps().indexOf(k);render()};h.append(e)}
    const chips=el("div","chips");
    names.forEach((n,j)=>{const c=el("span","pick sm "+(k==="win"&&Q().win>1?"dwin":k),n);if(!calm)c.style.animation="pop .4s cubic-bezier(.2,1.5,.4,1) both";c.style.animationDelay=(j*60)+"ms";chips.append(c)});
    if(!names.length)chips.append(el("span","hint","Nobody"));
    g.append(h,chips);P.append(g);
  });
  const back=el("button","btn","Back");back.type="button";back.onclick=()=>{step=steps().length-1;render()};
  footer(P,back);
}

function footer(P,back){
  const st=el("p","hint"),btn=el("button","btn primary");
  st.id="st";btn.id="save";btn.type="button";btn.onclick=submit;
  const nav=el("div","nav");if(back)nav.append(back);nav.append(btn);
  P.append(st,nav);status();
}
function status(){
  $("save").textContent=saved?"Update ballot":"Submit ballot";$("save").disabled=!complete();
  $("st").className="hint";
  $("st").textContent=saved&&!dirty?"Ballot saved. You can change it until voting closes.":saved?"You have unsaved changes.":"Not submitted yet.";
}
async function submit(){
  $("save").disabled=true;
  const data={round:S.round,ep:S.ep,mode:S.mode,uid:me.uid,at:serverTimestamp()};
  if(S.mode==="placements")ORDER.forEach(k=>data[k]=sel[k]);else if(S.mode==='lipsync')data.choices=lw;else data.choice=choice;
  try{await setDoc(doc(db,"ballots","r"+S.round+"_"+me.uid),data);saved=true;dirty=false;status()}
  catch{$("st").className="err";$("st").textContent="Couldn\u2019t save. Voting may have just closed.";$("save").disabled=false}
}
</script></body></html>
